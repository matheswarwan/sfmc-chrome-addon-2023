<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="./css/salesforce-lightning-design-system.min.css" />
    <link rel="stylesheet" href="./css/codemirror.css" />
    <link rel="stylesheet" href="./css/codemirror-twilight.css" />
    <script src="./js/jquery-3.6.0.min.js"></script>
    <script src="./js/codemirror.js"></script>
    <script src="./js/codemirror-sql.js"></script>
    <script src="./js/codemirror-javascript.js"></script>
    <title>SFMC Revert Changes</title>
    <style>
      html, body { height: 100% !important; margin: 0; }
      .full-height { height: 100% !important; }

      /* ── Left panel: flex column so the delete bar sticks to the bottom ── */
      .ck-left-split-view {
        display: flex !important;
        flex-direction: column;
        height: 100%;
        position: relative;
      }
      .ck-left-split-view article {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      /* The list area grows to fill available space */
      .ck-left-menu {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .ck-left-menu ul {
        flex: 1;
        overflow-y: auto;
      }
      /* Bottom action bar: always at the foot of the left panel */
      .ck-left-split-view-bottom {
        flex-shrink: 0;
        border-top: 1px solid #dddbda;
        background: #fff;
      }
      .ck-left-split-view-bottom .slds-button {
        width: 100%;
      }
      /* Delete bar appended by JS inside .ck-left-menu — sticky within the flex column */
      .ck-delete-bar {
        flex-shrink: 0;
      }

      /* ── Right panel ── */
      .ck-email-preview-body {
        height: calc(100vh - 120px);
        overflow: auto;
      }
      .ck-query-runner-wrap {
        height: 100%;
      }

      /* ── Checkbox alignment ── */
      .ck-select-checkbox { margin: 0; vertical-align: middle; }

      /* ── Favourite star hover ── */
      .ck-qs-fav:hover { opacity: 0.7; }

      /* ── Rename input inline ── */
      .ck-qs-label[contenteditable="true"] {
        border-bottom: 1px dashed #0070d2;
        outline: none;
      }

      /* ── Split-view toggle button height ── */
      .ck-left-split-view-toggle-btn { height: 100% !important; }
    </style>
  </head>
  <body>
    <div class="slds-grid full-height">

      <!-- ── Left panel ── -->
      <div class="slds-col full-height" style="max-width:320px;min-height:300px;">

        <div class="ck-left-split-view slds-split-view_container slds-is-open full-height">

          <button
            class="ck-left-split-view-toggle-btn slds-button slds-button_icon slds-split-view__toggle-button slds-is-open"
            aria-controls="split-view-id" aria-expanded="true" title="Close Split View">
            <svg class="slds-button__icon slds-button__icon_x-small" aria-hidden="true">
              <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#left"></use>
            </svg>
            <span class="slds-assistive-text">Close Split View</span>
          </button>

          <article aria-hidden="false" id="split-view-id"
            class="slds-split-view slds-grid slds-grid_vertical slds-grow">

            <header class="slds-split-view__header">
              <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                <!-- BU dropdown -->
                <div class="ck-left-split-view-buid-dropdown slds-dropdown-trigger slds-dropdown-trigger_click slds-is-closed">
                  <button
                    class="ck-left-split-view-buid-dropdown-btn slds-button slds-button_icon slds-button_icon-border-filled"
                    aria-haspopup="true" aria-expanded="true" title="Switch Business Unit">
                    <svg class="slds-button__icon" aria-hidden="true">
                      <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#down"></use>
                    </svg>
                    <span class="slds-assistive-text">Show More</span>
                  </button>
                  <span class="ck-buid-title"></span>
                  <div class="slds-dropdown slds-dropdown_left">
                    <ul class="ck-left-split-view-buid-dropdown-ul slds-dropdown__list" role="menu"></ul>
                  </div>
                </div>
              </div>

              <div class="slds-grid slds-grid_vertical-align-center">
                <p class="ck-title-items-count slds-text-body_small slds-text-color_weak"></p>
                <div class="slds-no-flex slds-grid slds-col_bump-left">
                  <div class="slds-button-group">
                    <button class="ck-items-refresh-btn slds-button slds-button_icon slds-button_icon-container"
                      title="Refresh List">
                      <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#refresh"></use>
                      </svg>
                      <span class="slds-assistive-text">Refresh List</span>
                    </button>
                  </div>
                </div>
              </div>
            </header>

            <!-- Category / asset list — filled by JS -->
            <div class="ck-left-menu slds-grid slds-grid_vertical">
              <div class="slds-split-view__list-header slds-grid">
                <span>Saved items</span>
              </div>
            </div>

          </article>

          <!-- Phase 3.1: sticky bottom bar with "Clear All" -->
          <div class="ck-left-split-view-bottom slds-grid">
            <div class="slds-col">
              <button class="ck-left-split-view-clear-all-btn slds-button slds-grow slds-button_text-destructive">
                Clear all contents
              </button>
            </div>
          </div>

        </div>
      </div>
      <!-- ── /Left panel ── -->

      <!-- ── Right panel ── -->
      <div class="slds-col">
        <div class="ck-email-toast-div slds-card slds-hide"></div>

        <article class="ck-email-preview-screen slds-card slds-hide">
          <div class="slds-grid slds-einstein-header slds-card__header">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
              <div class="slds-grid slds-grid_vertical-align-center slds-size_3-of-4 slds-medium-size_2-of-3">
                <div class="slds-media__figure">
                  <span class="slds-icon_container slds-icon-utility-salesforce1">
                    <svg class="slds-icon slds-icon_small slds-icon-text-default" aria-hidden="true">
                      <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#salesforce1"></use>
                    </svg>
                  </span>
                </div>
                <div class="slds-media__body">
                  <h2 class="slds-truncate">
                    <a href="#" class="slds-card__header-link">
                      <span class="ck-email-name slds-text-heading_small"></span>
                    </a>
                  </h2>
                </div>
              </div>
            </header>
            <div class="slds-einstein-header__actions">
              <div class="slds-button-group" role="group">
                <button
                  class="ck-revert-btn slds-button slds-button_icon slds-button_icon-border-filled"
                  assetId="" assetName="" memberId="" timeStamp=""
                  title="Revert email to this version" aria-pressed="false">
                  <svg class="slds-button__icon" aria-hidden="true">
                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#replace"></use>
                  </svg>
                  <span class="slds-assistive-text">Revert</span>
                </button>
              </div>
            </div>
          </div>

          <div id="ck-email-preview-body"
            class="ck-email-preview-body slds-card__body slds-card__body_inner"></div>

          <footer class="slds-card__footer">
            <a class="ck-preview-botton-action-btn slds-card__footer-action" href="#">
              Action
              <span class="ck-preview-botton-action-text slds-assistive-text">Action</span>
            </a>
          </footer>
        </article>
      </div>
      <!-- ── /Right panel ── -->

    </div>
    <script src="./index.js"></script>
  </body>
</html>
